<svg xmlns="http://www.w3.org/2000/svg" width="960" height="558" viewBox="0 0 960 558" role="img" aria-labelledby="title desc"><title id="title">필요한 정보에 따른 확인 경로</title><desc id="desc">찾는 정보에 따라 화면 캡처, 접근성 트리, WebView 검사, 공개 링크와 네트워크 응답을 선택하고 결과를 검증합니다.</desc><g font-family="Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="960" height="558" rx="20" fill="#f7f9fc" stroke="none"/><text x="36" y="43" font-size="20" font-weight="600" fill="#52647b">찾는 정보</text><text x="371" y="43" font-size="20" font-weight="600" fill="#52647b">확인할 곳</text><text x="684" y="43" font-size="20" font-weight="600" fill="#52647b">결과에서 확인할 것</text><rect x="20" y="66" width="920" height="102" rx="16" fill="#fff" stroke="#dde5ef"/><rect x="20" y="66" width="6" height="102" rx="3" fill="#2b66d9" stroke="none"/><text x="38" y="123" font-size="24" font-weight="600" fill="#172b45">할인 문구와 주문 조건</text><path d="M318 117 h28 m-8 -7 8 7 -8 7" stroke="#8fa2b9" fill="none" stroke-width="2"/><text x="371" y="123" font-size="25" font-weight="600" fill="#245ecb">화면 캡처 + OCR</text><path d="M631 117 h28 m-8 -7 8 7 -8 7" stroke="#8fa2b9" fill="none" stroke-width="2"/><text x="684" y="123" font-size="20" font-weight="400" fill="#172b45">찾던 혜택의 문구인가?</text><rect x="20" y="184" width="920" height="102" rx="16" fill="#fff" stroke="#dde5ef"/><rect x="20" y="184" width="6" height="102" rx="3" fill="#2b66d9" stroke="none"/><text x="38" y="241" font-size="24" font-weight="600" fill="#172b45">요소의 텍스트와 역할</text><path d="M318 235 h28 m-8 -7 8 7 -8 7" stroke="#8fa2b9" fill="none" stroke-width="2"/><text x="371" y="241" font-size="25" font-weight="600" fill="#245ecb">접근성 트리</text><path d="M631 235 h28 m-8 -7 8 7 -8 7" stroke="#8fa2b9" fill="none" stroke-width="2"/><text x="684" y="241" font-size="20" font-weight="400" fill="#172b45">빠지거나 나뉜 값은 없는가?</text><rect x="20" y="302" width="920" height="102" rx="16" fill="#fff" stroke="#dde5ef"/><rect x="20" y="302" width="6" height="102" rx="3" fill="#2b66d9" stroke="none"/><text x="38" y="359" font-size="24" font-weight="600" fill="#172b45">앱 안의 웹 콘텐츠</text><path d="M318 353 h28 m-8 -7 8 7 -8 7" stroke="#8fa2b9" fill="none" stroke-width="2"/><text x="371" y="359" font-size="25" font-weight="600" fill="#245ecb">WebView 검사</text><path d="M631 353 h28 m-8 -7 8 7 -8 7" stroke="#8fa2b9" fill="none" stroke-width="2"/><text x="684" y="345" font-size="20" font-weight="400" fill="#172b45">주소와 문서 구조를</text><text x="684" y="375" font-size="20" font-weight="400" fill="#172b45">읽을 수 있는가?</text><rect x="20" y="420" width="920" height="102" rx="16" fill="#fff" stroke="#dde5ef"/><rect x="20" y="420" width="6" height="102" rx="3" fill="#2b66d9" stroke="none"/><text x="38" y="477" font-size="24" font-weight="600" fill="#172b45">특정 화면을 여는 주소</text><path d="M318 471 h28 m-8 -7 8 7 -8 7" stroke="#8fa2b9" fill="none" stroke-width="2"/><text x="371" y="464" font-size="25" font-weight="600" fill="#245ecb">공개된 링크부터</text><text x="371" y="494" font-size="18" font-weight="400" fill="#52647b">필요하면 네트워크 응답</text><path d="M631 471 h28 m-8 -7 8 7 -8 7" stroke="#8fa2b9" fill="none" stroke-width="2"/><text x="684" y="463" font-size="20" font-weight="400" fill="#172b45">외부에서 목표 화면이</text><text x="684" y="493" font-size="20" font-weight="400" fill="#172b45">열리는가?</text></g></svg>