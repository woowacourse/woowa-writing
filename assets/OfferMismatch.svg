<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" aria-labelledby="title desc"><title id="title">같은 브랜드, 다른 혜택</title><desc id="desc">4,000원 쿠폰의 최소주문금액 16,000원을 7,000원 행사의 조건으로 사용할 수 없습니다.</desc><g font-family="Apple SD Gothic Neo,Noto Sans KR,Malgun Gothic,sans-serif"><rect x="0" y="0" width="960" height="408" rx="20" fill="#f7f9fc" stroke="none"/><text x="30" y="45" font-size="28" font-weight="700" fill="#172b45">같은 브랜드, 다른 혜택</text><rect x="24" y="70" width="442" height="238" rx="16" fill="#fff" stroke="#cbdaf1"/><rect x="494" y="70" width="442" height="238" rx="16" fill="#fff" stroke="#dbe0e7"/><text x="48" y="108" font-size="22" font-weight="600" fill="#52647b">캡처에서 읽은 쿠폰</text><text x="518" y="108" font-size="22" font-weight="600" fill="#52647b">웹에서 찾던 행사</text><text x="48" y="171" font-size="44" font-weight="700" fill="#245ecb">4,000원 할인</text><text x="518" y="171" font-size="44" font-weight="700" fill="#172b45">7,000원 행사</text><text x="48" y="226" font-size="20" font-weight="400" fill="#52647b">최소주문금액</text><text x="518" y="226" font-size="20" font-weight="400" fill="#52647b">최소주문금액</text><text x="48" y="272" font-size="32" font-weight="600" fill="#172b45">16,000원</text><text x="518" y="272" font-size="30" font-weight="600" fill="#9a6415">확인되지 않음</text><rect x="24" y="330" width="912" height="56" rx="12" fill="#eaf0fa" stroke="none"/><text x="48" y="366" font-size="25" font-weight="600" fill="#294c7b">16,000원을 7,000원 행사의 조건으로 옮길 수 없음</text></g></svg>