<svg xmlns="http://www.w3.org/2000/svg" width="960" height="438" viewBox="0 0 960 438" role="img" aria-label="캐시에서 바로 찾은 요청의 구간별 평균 시간. 캐시에서 핀 고르기는 약 0.46ms이고 응답 만들기는 약 36ms" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>캐시에서 바로 찾은 요청의 구간별 평균 시간. 캐시에서 핀 고르기는 약 0.46ms이고 응답 만들기는 약 36ms</title><rect x="0.5" y="0.5" width="959" height="437" rx="14" fill="#ffffff" stroke="#d9ddda"/><text x="28.0" y="40.0" font-size="19" fill="#1f2421" font-weight="700" text-anchor="start" >캐시에서 바로 찾았는데도 남아 있던 구간 시간</text><text x="28.0" y="64.0" font-size="13" fill="#4f5552" font-weight="400" text-anchor="start" >2026-10-31 / 기존 v2 API / 가상 사용자 100명 / 600초 3회 / 구간별 평균 시간 (막대는 3회 범위의 중간값)</text><line x1="300.0" x2="300.0" y1="92" y2="360" stroke="#e6e9e7"/><text x="300.0" y="378.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="middle" >0ms</text><line x1="385.0" x2="385.0" y1="92" y2="360" stroke="#e6e9e7"/><text x="385.0" y="378.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="middle" >10ms</text><line x1="470.0" x2="470.0" y1="92" y2="360" stroke="#e6e9e7"/><text x="470.0" y="378.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="middle" >20ms</text><line x1="555.0" x2="555.0" y1="92" y2="360" stroke="#e6e9e7"/><text x="555.0" y="378.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="middle" >30ms</text><line x1="640.0" x2="640.0" y1="92" y2="360" stroke="#e6e9e7"/><text x="640.0" y="378.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="middle" >40ms</text><line x1="725.0" x2="725.0" y1="92" y2="360" stroke="#e6e9e7"/><text x="725.0" y="378.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="middle" >50ms</text><line x1="810.0" x2="810.0" y1="92" y2="360" stroke="#e6e9e7"/><text x="810.0" y="378.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="middle" >60ms</text><text x="286.0" y="120.0" font-size="13.5" fill="#1f2421" font-weight="400" text-anchor="end" >캐시에서 핀 고르기</text><path d="M300,106 H301.948625 Q303.89725,106 303.89725,107.948625 V124.051375 Q303.89725,126 301.948625,126 H300 Z" fill="#9aa39e"/><text x="313.9" y="121.0" font-size="13" fill="#1f2421" font-weight="400" text-anchor="start" >0.44–0.47ms</text><text x="286.0" y="164.0" font-size="13.5" fill="#1f2421" font-weight="400" text-anchor="end" >차단 목록 확인 (DB)</text><path d="M300,150 H345.63575000000003 Q349.63575000000003,150 349.63575000000003,154 V166 Q349.63575000000003,170 345.63575000000003,170 H300 Z" fill="#9aa39e"/><text x="359.6" y="165.0" font-size="13" fill="#1f2421" font-weight="400" text-anchor="start" >5.8–5.9ms</text><text x="286.0" y="208.0" font-size="13.5" fill="#1f2421" font-weight="400" text-anchor="end" >응답 보내기 (핀과 지역 합계)</text><path d="M300,194 H384.95675 Q388.95675,194 388.95675,198 V210 Q388.95675,214 384.95675,214 H300 Z" fill="#9aa39e"/><text x="399.0" y="209.0" font-size="13" fill="#1f2421" font-weight="400" text-anchor="start" >10.4–10.5ms</text><text x="286.0" y="252.0" font-size="13.5" fill="#1f2421" font-weight="400" text-anchor="end" >기기 확인 (DB)</text><path d="M300,238 H476.90975000000003 Q480.90975000000003,238 480.90975000000003,242 V254 Q480.90975000000003,258 476.90975000000003,258 H300 Z" fill="#9aa39e"/><text x="490.9" y="253.0" font-size="13" fill="#1f2421" font-weight="400" text-anchor="start" >21.1–21.5ms</text><text x="286.0" y="296.0" font-size="13.5" fill="#1f2421" font-weight="700" text-anchor="end" >응답 만들기 (스탬프 DB 조회 포함)</text><path d="M300,282 H605.34475 Q609.34475,282 609.34475,286 V298 Q609.34475,302 605.34475,302 H300 Z" fill="#eda100"/><text x="619.3" y="297.0" font-size="13" fill="#1f2421" font-weight="700" text-anchor="start" >35.7–37.1ms</text><text x="286.0" y="340.0" font-size="13.5" fill="#1f2421" font-weight="400" text-anchor="end" >요청 값 읽기와 검증 (핀과 지역 합계)</text><path d="M300,326 H707.07275 Q711.07275,326 711.07275,330 V342 Q711.07275,346 707.07275,346 H300 Z" fill="#9aa39e"/><text x="721.1" y="341.0" font-size="13" fill="#1f2421" font-weight="400" text-anchor="start" >45.2–51.5ms</text><text x="28.0" y="408.0" font-size="12.5" fill="#4f5552" font-weight="400" text-anchor="start" >구간은 서로 겹쳐 있어 더하지 않습니다. 캐시에서 핀을 고르는 데는 1ms도 안 걸렸지만 응답 만들기는 약 36ms였습니다.</text></svg>