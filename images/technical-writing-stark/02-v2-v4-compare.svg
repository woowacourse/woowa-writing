<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="v2 대비 v4는 응답 만들기가 약 40ms에서 0.4ms로 줄고 처리량이 약 156에서 235 RPS로 늘고 핀 p95가 약 250에서 146ms로 줄었지만 CPU는 95%로 같음" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>v2 대비 v4는 응답 만들기가 약 40ms에서 0.4ms로 줄고 처리량이 약 156에서 235 RPS로 늘고 핀 p95가 약 250에서 146ms로 줄었지만 CPU는 95%로 같음</title><rect x="0.5" y="0.5" width="959" height="379" rx="14" fill="#ffffff" stroke="#d9ddda"/><text x="28.0" y="40.0" font-size="19" fill="#1f2421" font-weight="700" text-anchor="start" >스탬프 조회를 없앤 v4: 처리량은 늘었지만 CPU는 그대로</text><text x="28.0" y="64.0" font-size="13" fill="#4f5552" font-weight="400" text-anchor="start" >같은 서버와 데이터 / 가상 사용자 100명 / 600초 / v2와 v4 각 3회 / 막대는 3회 범위의 중간값이고 숫자는 범위</text><rect x="640" y="54" width="12" height="12" rx="3" fill="#9aa39e"/><text x="658.0" y="64.0" font-size="12.5" fill="#4f5552" font-weight="400" text-anchor="start" >v2 (기존)</text><rect x="750.5" y="54" width="12" height="12" rx="3" fill="#eda100"/><text x="768.5" y="64.0" font-size="12.5" fill="#4f5552" font-weight="400" text-anchor="start" >v4 (스탬프 조회 제거)</text><text x="36.0" y="102.0" font-size="14.5" fill="#1f2421" font-weight="700" text-anchor="start" >응답 만들기</text><text x="36.0" y="120.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="start" >낮을수록 좋음</text><line x1="36" x2="240" y1="300" y2="300" stroke="#e6e9e7"/><path d="M72,300 V178.2548435171386 Q72,174.2548435171386 76,174.2548435171386 H92 Q96,174.2548435171386 96,178.2548435171386 V300 Z" fill="#9aa39e"/><text x="84.0" y="164.3" font-size="12" fill="#1f2421" font-weight="400" text-anchor="middle" >39.4–40.3</text><text x="84.0" y="320.0" font-size="12.5" fill="#4f5552" font-weight="400" text-anchor="middle" >v2</text><path d="M156,300 V299.3527242415822 Q156,298.7054484831645 156.64727575841775,298.7054484831645 H179.35272424158225 Q180,298.7054484831645 180,299.3527242415822 V300 Z" fill="#eda100"/><text x="168.0" y="288.7" font-size="12" fill="#1f2421" font-weight="700" text-anchor="middle" >0.38–0.44</text><text x="168.0" y="320.0" font-size="12.5" fill="#4f5552" font-weight="400" text-anchor="middle" >v4</text><text x="138.0" y="340.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="middle" >ms</text><text x="268.0" y="102.0" font-size="14.5" fill="#1f2421" font-weight="700" text-anchor="start" >초당 처리한 요청 수</text><text x="268.0" y="120.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="start" >높을수록 좋음</text><line x1="268" x2="472" y1="300" y2="300" stroke="#e6e9e7"/><path d="M304,300 V220.24501205427686 Q304,216.24501205427686 308,216.24501205427686 H324 Q328,216.24501205427686 328,220.24501205427686 V300 Z" fill="#9aa39e"/><text x="316.0" y="206.2" font-size="12" fill="#1f2421" font-weight="400" text-anchor="middle" >153.9–157.5</text><text x="316.0" y="320.0" font-size="12.5" fill="#4f5552" font-weight="400" text-anchor="middle" >v2</text><path d="M388,300 V177.61031510403402 Q388,173.61031510403402 392,173.61031510403402 H408 Q412,173.61031510403402 412,177.61031510403402 V300 Z" fill="#eda100"/><text x="400.0" y="163.6" font-size="12" fill="#1f2421" font-weight="700" text-anchor="middle" >233.6–236.3</text><text x="400.0" y="320.0" font-size="12.5" fill="#4f5552" font-weight="400" text-anchor="middle" >v4</text><text x="370.0" y="340.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="middle" >RPS</text><text x="500.0" y="102.0" font-size="14.5" fill="#1f2421" font-weight="700" text-anchor="start" >핀 p95</text><text x="500.0" y="120.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="start" >낮을수록 좋음</text><line x1="500" x2="704" y1="300" y2="300" stroke="#e6e9e7"/><path d="M536,300 V180.1585289728849 Q536,176.1585289728849 540,176.1585289728849 H556 Q560,176.1585289728849 560,180.1585289728849 V300 Z" fill="#9aa39e"/><text x="548.0" y="166.2" font-size="12" fill="#1f2421" font-weight="400