<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="고정 RPS별 p95는 100 RPS 15.8ms와 150 RPS 22.5ms 그리고 175 RPS 44.6ms와 200 RPS 122.8ms" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><title>고정 RPS별 p95는 100 RPS 15.8ms와 150 RPS 22.5ms 그리고 175 RPS 44.6ms와 200 RPS 122.8ms</title><rect x="0.5" y="0.5" width="959" height="429" rx="14" fill="#ffffff" stroke="#d9ddda"/><text x="28.0" y="40.0" font-size="19" fill="#1f2421" font-weight="700" text-anchor="start" >초당 요청 수를 고정하면 보이는 용량 곡선</text><text x="28.0" y="64.0" font-size="13" fill="#4f5552" font-weight="400" text-anchor="start" >v4 핀 / 삼평동 다음 페이지 / 2분 예열 후 5분 측정 / 150 RPS와 175 RPS는 3회(점은 중앙값이고 세로선은 범위)</text><line x1="90" x2="900" y1="340.0" y2="340.0" stroke="#e6e9e7"/><text x="80.0" y="344.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="end" >0</text><line x1="90" x2="900" y1="305.7142857142857" y2="305.7142857142857" stroke="#e6e9e7"/><text x="80.0" y="309.7" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="end" >20</text><line x1="90" x2="900" y1="271.42857142857144" y2="271.42857142857144" stroke="#e6e9e7"/><text x="80.0" y="275.4" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="end" >40</text><line x1="90" x2="900" y1="237.14285714285717" y2="237.14285714285717" stroke="#e6e9e7"/><text x="80.0" y="241.1" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="end" >60</text><line x1="90" x2="900" y1="202.85714285714286" y2="202.85714285714286" stroke="#e6e9e7"/><text x="80.0" y="206.9" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="end" >80</text><line x1="90" x2="900" y1="168.57142857142856" y2="168.57142857142856" stroke="#e6e9e7"/><text x="80.0" y="172.6" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="end" >100</text><line x1="90" x2="900" y1="134.2857142857143" y2="134.2857142857143" stroke="#e6e9e7"/><text x="80.0" y="138.3" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="end" >120</text><line x1="90" x2="900" y1="100.0" y2="100.0" stroke="#e6e9e7"/><text x="80.0" y="104.0" font-size="11.5" fill="#7a807c" font-weight="400" text-anchor="end" >140</text><text x="80.0" y="82.0" font-size="12" fill="#4f5552" font-weight="400" text-anchor="end" >p95 (ms)</text><line x1="90" x2="900" y1="168.57142857142856" y2="168.57142857142856" stroke="#1f2421" stroke-width="1.2"/><text x="900.0" y="160.6" font-size="12.5" fill="#1f2421" font-weight="700" text-anchor="end" >100ms</text><path d="M205.7,312.9 L495.0,301.4 L639.6,263.5 L784.3,129.5" fill="none" stroke="#eda100" stroke-width="2.4" stroke-linejoin="round"/><circle cx="205.71428571428572" cy="312.9142857142857" r="6" fill="#eda100" stroke="#ffffff" stroke-width="2"/><text x="217.7" y="302.9" font-size="13.5" fill="#1f2421" font-weight="700" text-anchor="start" >15.8ms</text><text x="205.7" y="362.0" font-size="12.5" fill="#1f2421" font-weight="700" text-anchor="middle" >100 RPS</text><text x="205.7" y="380.0" font-size="11.5" fill="#4f5552" font-weight="400" text-anchor="middle" >CPU 43.4% / 1회</text><line x1="495.0" x2="495.0" y1="302.2857142857143" y2="299.0285714285714" stroke="#1f2421" stroke-width="2"/><circle cx="495.0" cy="301.42857142857144" r="6" fill="#eda100" stroke="#ffffff" stroke-width="2"/><text x="483.0" y="289.4" font-size="13.5" fill="#1f2421" font-weight="700" text-anchor="end" >22.5ms</text><text x="495.0" y="362.0" font-size="12.5" fill="#1f2421" font-weight="700" text-anchor="middle" >150 RPS</text><text x="495.0" y="380.0" font-size="11.5" fill="#4f5552" font-weight="400" text-anchor="middle" >CPU 62.4% / 3회</text><line x1="639.6428571428572" x2="639.6428571428572" y1="263.7142857142857" y2="261.3142857142857" stroke="#1f2421" stroke-width="2"/><circle cx="639.6428571428572" cy="263.54285714285714" r="6" fill="#eda100" stroke="#ffffff" stroke-width="2"/><text x="627.6" y="251.5" font-size="13.5" fill="#1f2421" font-weight="700" text-anchor="end" >44.6ms</text><text x="639.6" y="362.0" font-size="12.5" fill="#1f2421" font-weight="700" text-anchor="middle" >175 RPS</text><text x="639.6" y="380.0" font-size="11.5" fill="#4f5552" font-weight="400" text-anchor="middle" >CPU 72.5% / 3회</text><circle cx="784.2857142857142" cy="129.4857142857143" r="6" fill="#eda100" stroke="#ffffff" stroke-width="2"/><text x="772.3" y="117.5" font-size="13.5" fill="#1f2421" font-weight="700" text-anchor="end" >122.8ms</text><text x="784.3" y="362.0" font-size="12.5" fill="#1f2421" font-weight="700" text-anchor="middle" >200 RPS</text><text x="784.3" y="380.0" font-size="11.5" fill="#4f5552" font-weight="400" text-anchor="middle" >CPU 82.4% / 1회</text><text x="28.0" y="412.0" font-size="12.5" fill="#4f5552" font-weight="400" text-anchor="start" >175→200 RPS 사이에서 응답이 급격히 느려집니다. 같은 코드로 가상 사용자 100명 시험을 했을 때 핀 p95는 145ms였습니다(요청 구성이 달라 직접 비교는 아님).</text></svg>